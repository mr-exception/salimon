server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The client is a static single-page app; return its entry point for routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A missing build asset must be a real 404, not the app's HTML.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
