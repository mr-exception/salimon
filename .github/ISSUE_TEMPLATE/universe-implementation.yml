name: Universe implementation
description: Plan a scoped Universe implementation or follow-up with same-PR documentation.
title: "[Universe] "
body:
  - type: textarea
    id: scope
    attributes:
      label: Scope and approved decisions
      description: Link the source issue/design and state resulting behavior without expanding requirements.
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: Blocked by
      description: List exact issues and unresolved decisions, or explicitly say None.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and validation
      description: Typed ownership, meaningful portable tests, report path and separate native gates.
    validations:
      required: true
  - type: textarea
    id: documentation
    attributes:
      label: Documentation impact (U35)
      description: Identify affected owning architecture/invariants, README/AI guides, root maps, domain contracts and commands. Update them in the same PR; justify a precise no-impact exception if applicable.
    validations:
      required: true
  - type: checkboxes
    id: documentation_gate
    attributes:
      label: Completion gate
      options:
        - label: Implementation will include same-PR documentation changes or a justified precise no-impact statement, owning guide links and link/path checks. Final audit 441 is not a substitute.
          required: true
        - label: Reports will distinguish portable delivery from unrun or failed native acceptance and link remaining follow-up ownership.
          required: true
