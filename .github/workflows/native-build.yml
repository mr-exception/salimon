name: Source build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Source build (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Keep developer rustfmt/Clippy components out of this build-only job.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libxkbcommon-dev libwayland-dev
      - name: Compile workspace
        run: cargo build --workspace --locked
      - name: Verify stack
        run: |
          cargo fmt --all
          echo FORMAT_PATCH_START
          git diff --binary
          echo FORMAT_PATCH_END
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Lookup and update attribution
        run: |
          sudo apt-get install -y --no-install-recommends heaptrack
          mkdir -p artifacts
          cargo test --release -p salimon-world --locked fragment_index_cost -- --ignored --nocapture | tee artifacts/index-cost.log
          python3 scripts/fragment_update_attribution.py --before 9f6fdf7dee6ca1075762b9b55b5c7df204f89c9a --after HEAD --output artifacts/fragment-attribution --heaptrack
      - name: Retain portable evidence
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip
          root=Path("artifacts")
          for path in sorted(root.rglob("*")):
              if path.name in ("timings.json.gz","metadata.json","allocations.txt","index-cost.log","allocation-fixture.json"):
                  print("EVIDENCE_START "+str(path))
                  print(base64.b64encode(gzip.compress(path.read_bytes())).decode())
                  print("EVIDENCE_END")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fragment-stack-attribution
          path: |
            artifacts/fragment-attribution
            artifacts/index-cost.log
