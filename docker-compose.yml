services:
  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    ports:
      - "${SALIMON_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
