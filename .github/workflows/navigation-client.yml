name: Navigation client

on:
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/navigation-client.yml'
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/navigation-client.yml'

concurrency:
  group: navigation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install locked dependencies
        working-directory: client
        run: npm ci --no-audit --no-fund
      - name: Domain and integration tests
        working-directory: client
        run: npm test
      - name: Build and typecheck
        working-directory: client
        run: npm run build
      - name: Install Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Deterministic navigation, desktop and production WebGL checks
        working-directory: client
        run: npm run test:browser
      - name: Prove intentional navigation regressions fail
        working-directory: client
        run: npm run test:browser:negative
      - name: Repeat visual comparisons for determinism
        working-directory: client
        env:
          SALIMON_EVIDENCE_DIR: test-results/visual-repeat
        run: npm run test:visual
      - name: Prove a real visual defect fails comparison
        working-directory: client
        run: npm run test:visual:negative
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-evidence-${{ github.sha }}
          path: client/test-results/
          retention-days: 14

  baseline-approval:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install locked dependencies
        working-directory: client
        run: npm ci --no-audit --no-fund
      - name: Require explicit human approval for changed baselines
        working-directory: client
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SALIMON_PR_NUMBER: ${{ github.event.pull_request.number }}
          SALIMON_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run test:visual:approval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-baseline-approval-${{ github.sha }}
          path: client/test-results/baseline-approval.json
          retention-days: 14
