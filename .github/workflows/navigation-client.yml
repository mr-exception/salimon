name: Navigation client

on:
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/navigation-client.yml'
      - '.github/workflows/navigation-client-full.yml'
      - '.github/scripts/**'
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/navigation-client.yml'
      - '.github/workflows/navigation-client-full.yml'
      - '.github/scripts/**'

concurrency:
  group: navigation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # Keep the established build check name; exhaustive regression is scheduled.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install locked dependencies
        working-directory: client
        run: npm ci --no-audit --no-fund
      - name: Validate CI automation contracts
        run: node .github/scripts/navigation-ci.test.cjs
      - name: Domain and integration tests
        working-directory: client
        run: npm test
      - name: Build and typecheck
        working-directory: client
        run: npm run build
      - name: Install Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Production, scanner and flight browser smoke
        working-directory: client
        run: npm run test:browser:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: client/test-results/
          retention-days: 14
