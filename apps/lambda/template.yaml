AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Salimon Lambda API

Parameters:
  MongoDbUri:
    Type: String
    Description: MongoDB connection URI, including credentials and database name
    NoEcho: true
  OpenAiApiKey:
    Type: String
    Description: Server-side OpenAI API key for NPC replies
    NoEcho: true
  OpenAiModel:
    Type: String
    Description: OpenAI model used for NPC replies
    Default: gpt-5.4-mini

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowHeaders:
          - Content-Type
          - X-Spaceship-Security-Code
        AllowMethods:
          - GET
          - POST
          - PUT
        AllowOrigins:
          - '*'

  WorldSystemsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/systems.zip
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
      Events:
        GetWorldSystems:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /world/systems

  UpdatePlanetsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/update-planets.zip
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
      Events:
        UpdateOldestPlanets:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0/5 * * * ? *)
            RetryPolicy:
              MaximumRetryAttempts: 2

  UpdateMoonsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/update-moons.zip
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
      Events:
        UpdateOldestMoons:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0/5 * * * ? *)
            RetryPolicy:
              MaximumRetryAttempts: 2

  UpdateStarsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/update-stars.zip
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
      Events:
        UpdateOldestStars:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0/5 * * * ? *)
            RetryPolicy:
              MaximumRetryAttempts: 2

  UpdateSpaceshipsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/update-spaceships.zip
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
      Events:
        UpdateOldestSpaceships:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0/5 * * * ? *)
            RetryPolicy:
              MaximumRetryAttempts: 2

  RegisterSpaceshipFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/register-spaceship.zip
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
      Events:
        RegisterSpaceship:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /spaceship/register

  SpaceshipInfoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/spaceship-info.zip
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
      Events:
        GetSpaceshipInfo:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /spaceship/info

  UpdateSpaceshipFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/update-spaceship.zip
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
      Events:
        UpdateSpaceship:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PUT
            Path: /spaceship/update

  ContactReplyDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-contact-reply-dlq.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      MessageRetentionPeriod: 1209600

  ContactReplyQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-contact-replies.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ContactReplyDeadLetterQueue.Arn
        maxReceiveCount: 3

  ContactsInfoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/contacts-info.zip
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
      Events:
        GetContacts:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /contacts/info

  ContactMessagesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/contact-messages.zip
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
      Events:
        GetContactMessages:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /contacts/messages

  UnreadContactMessagesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/unread-contact-messages.zip
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
      Events:
        GetUnreadContactMessages:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /contacts/messages/unread

  SendContactMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/send-contact-message.zip
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
          CONTACT_REPLY_QUEUE_URL: !Ref ContactReplyQueue
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ContactReplyQueue.QueueName
      Events:
        SendContactMessage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /contacts/messages/send

  GenerateContactReplyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/generate-contact-reply.zip
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 120
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
          OPENAI_API_KEY: !Ref OpenAiApiKey
          OPENAI_MODEL: !Ref OpenAiModel
      Events:
        GenerateReply:
          Type: SQS
          Properties:
            Queue: !GetAtt ContactReplyQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

Outputs:
  ApiBaseUrl:
    Description: Base URL consumed by VITE_API_BASE_URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
