name: Source build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: source-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Source build (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Keep developer rustfmt/Clippy components out of this build-and-portable-test job.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Documentation validator contracts
        run: python -m unittest discover -s scripts -p test_check_docs.py -v
      - name: Architecture audit contracts
        run: python -m unittest discover -s scripts -p 'test_architecture_*.py' -v
      - name: Architecture review candidates (non-blocking)
        continue-on-error: true
        run: python scripts/architecture_audit.py --output artifacts/architecture/current.json --summary
      - name: Read active PR file inventories (including drafts)
        id: active-prs
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pulls = await github.paginate(github.rest.pulls.list, {
              ...context.repo, state: 'open', per_page: 100
            });
            const inventories = [];
            for (const pull of pulls) {
              if (pull.number === context.issue.number) continue;
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo, pull_number: pull.number, per_page: 100
              });
              if (files.length >= 3000) throw new Error(`PR #${pull.number}: file inventory may be truncated`);
              inventories.push({number: pull.number, head_sha: pull.head.sha,
                draft: pull.draft, paths: files.map(file => file.filename)});
            }
            fs.mkdirSync('artifacts/architecture', {recursive: true});
            fs.writeFileSync('artifacts/architecture/active-prs.json', JSON.stringify(inventories));
      - name: Architecture boundaries and PR overlap (warning-only)
        continue-on-error: true
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          INVENTORY_STATUS: ${{ steps.active-prs.outcome }}
        run: |
          base="$REVIEW_BASE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD^)
          fi
          args=(--base "$base" --output artifacts/architecture/review.json)
          if [ "$INVENTORY_STATUS" = success ]; then
            args+=(--active-prs artifacts/architecture/active-prs.json)
          fi
          if [ -n "$REVIEW_PR" ]; then args+=(--current-pr "$REVIEW_PR"); fi
          python scripts/architecture_review.py "${args[@]}" > artifacts/architecture/review.txt
          cat artifacts/architecture/review.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-audit
          path: artifacts/architecture/
          if-no-files-found: warn
      - name: Offline documentation validation
        env:
          DOCS_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$DOCS_BASE" ]; then
            python scripts/check_docs.py --base "$DOCS_BASE"
          else
            python scripts/check_docs.py
          fi
      - name: Offline source importer contracts
        run: |
          python -m unittest discover -s scripts -p test_import_universe_sources.py -v
          python scripts/import_universe_sources.py --output artifacts/universe-sources
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev libxkbcommon-dev libwayland-dev
      - name: Compile workspace
        run: cargo build --workspace --locked
      - name: Portable workspace unit and session E2E contracts
        run: cargo test --workspace --locked
      - name: Deterministic offline scientific fixture ingestion
        run: |
          cargo run -p salimon-universe --example observed_import --locked > artifacts/observed-v1.json
          cargo run -p salimon-universe --example observed_import --locked > artifacts/observed-v1-repeat.json
          cmp artifacts/observed-v1.json artifacts/observed-v1-repeat.json
      - name: Fixed-seed inference scientific sanity and reproducibility
        run: |
          cargo run -p salimon-universe --example inference_sanity --locked > artifacts/inference-v1.json
          cargo run -p salimon-universe --example inference_sanity --locked > artifacts/inference-v1-repeat.json
          cmp artifacts/inference-v1.json artifacts/inference-v1-repeat.json
      - name: Canonical fiction distribution, storage and reproducibility
        run: |
          cargo run -p salimon-universe --example fiction_sanity --locked > artifacts/fiction-v1.json
          cargo run -p salimon-universe --example fiction_sanity --locked > artifacts/fiction-v1-repeat.json
          cmp artifacts/fiction-v1.json artifacts/fiction-v1-repeat.json
          cargo run -p salimon-universe --example fiction_build --locked -- client/universe/fixtures/schema-v1.json client/universe/fixtures/fiction-request-v1.json artifacts/fiction-publication-v1.json
      - name: Permanent starting world publication and reproducibility
        run: |
          cargo run -p salimon-universe --example starting_system --locked > artifacts/starting-world-v1.json
          cargo run -p salimon-universe --example starting_system --locked > artifacts/starting-world-v1-repeat.json
          cmp artifacts/starting-world-v1.json artifacts/starting-world-v1-repeat.json
          cmp artifacts/starting-world-v1.json client/universe/fixtures/starting-world-v1.json

  fiction-portable-golden:
    name: Fiction publication golden (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Portable cross-platform identity and publication hashes
        run: cargo test -p salimon-universe --locked synthesis
      - name: Optimized cross-platform identity and publication hashes
        run: cargo test -p salimon-universe --release --locked synthesis
      - name: Permanent starting world cross-platform golden
        run: cargo test -p salimon-universe --locked starting_system
      - name: Optimized permanent starting world cross-platform golden
        run: cargo test -p salimon-universe --release --locked starting_system
      - name: Retain publication bytes on golden failure
        if: failure()
        shell: bash
        run: |
          mkdir -p artifacts
          cargo run -p salimon-universe --example fiction_build --locked -- client/universe/fixtures/schema-v1.json client/universe/fixtures/fiction-request-v1.json artifacts/fiction-publication-ci.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fiction-publication-${{ matrix.os }}
          path: artifacts/fiction-publication-ci.json
          if-no-files-found: ignore
