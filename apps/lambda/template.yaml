AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Salimon Lambda API

Parameters:
  MongoDbUri:
    Type: String
    Description: MongoDB connection URI, including credentials and database name
    NoEcho: true

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowHeaders:
          - Content-Type
          - X-Spaceship-Security-Code
        AllowMethods:
          - GET
          - POST
          - PUT
        AllowOrigins:
          - '*'

  WorldSystemsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/systems.zip
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
      Events:
        GetWorldSystems:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /world/systems

  UpdatePlanetsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/update-planets.zip
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
      Events:
        UpdateOldestPlanets:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0/5 * * * ? *)
            RetryPolicy:
              MaximumRetryAttempts: 2

  UpdateMoonsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/update-moons.zip
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
      Events:
        UpdateOldestMoons:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0/5 * * * ? *)
            RetryPolicy:
              MaximumRetryAttempts: 2

  UpdateStarsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/update-stars.zip
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
      Events:
        UpdateOldestStars:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0/5 * * * ? *)
            RetryPolicy:
              MaximumRetryAttempts: 2

  UpdateSpaceshipsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/update-spaceships.zip
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
      Events:
        UpdateOldestSpaceships:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0/5 * * * ? *)
            RetryPolicy:
              MaximumRetryAttempts: 2

  RegisterSpaceshipFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/register-spaceship.zip
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
      Events:
        RegisterSpaceship:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /spaceship/register

  SpaceshipInfoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/spaceship-info.zip
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
      Events:
        GetSpaceshipInfo:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /spaceship/info

  UpdateSpaceshipFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/update-spaceship.zip
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          MONGODB_URI: !Ref MongoDbUri
      Events:
        UpdateSpaceship:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PUT
            Path: /spaceship/update

Outputs:
  ApiBaseUrl:
    Description: Base URL consumed by VITE_API_BASE_URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
