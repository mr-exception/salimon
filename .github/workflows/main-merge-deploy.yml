name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: main-merge-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Install packages and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Build project
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Upload client build
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: apps/client/dist
          if-no-files-found: error
          retention-days: 1

      - name: Upload Lambda build
        uses: actions/upload-artifact@v4
        with:
          name: lambda-dist
          path: |
            apps/lambda/dist/systems.zip
            apps/lambda/dist/update-planets.zip
            apps/lambda/dist/update-moons.zip
            apps/lambda/dist/update-stars.zip
            apps/lambda/dist/register-spaceship.zip
            apps/lambda/dist/spaceship-info.zip
            apps/lambda/dist/update-spaceship.zip
            apps/lambda/template.yaml
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download client build
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: apps/client/dist

      - name: Download Lambda build
        uses: actions/download-artifact@v4
        with:
          name: lambda-dist
          path: apps/lambda

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Package Lambda stack
        run: |
          aws cloudformation package \
            --template-file apps/lambda/template.yaml \
            --s3-bucket "${{ vars.AWS_LAMBDA_ARTIFACTS_BUCKET }}" \
            --output-template-file apps/lambda/packaged.yaml

      - name: Deploy Lambda stack
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          aws cloudformation deploy \
            --template-file apps/lambda/packaged.yaml \
            --stack-name "${{ vars.AWS_LAMBDA_STACK_NAME }}" \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              MongoDbUri="$MONGODB_URI" \
            --no-fail-on-empty-changeset

      - name: Deploy client to S3
        run: aws s3 sync apps/client/dist "s3://${{ vars.AWS_S3_BUCKET }}" --delete
