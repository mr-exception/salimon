name: Docker client smoke

on:
  pull_request:
    paths:
      - 'client/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/docker-client.yml'
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/docker-client.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml config --quiet
      - name: Build and start the production client
        run: docker compose up --build -d --wait --wait-timeout 90
      - name: Verify production assets and SPA routing
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8080/ -o /tmp/salimon-index.html
          grep -q '<div id="root"></div>' /tmp/salimon-index.html
          asset="$(grep -oE '/assets/[^"]+\.js' /tmp/salimon-index.html | head -n 1)"
          test -n "$asset"
          curl --fail --silent --show-error "http://127.0.0.1:8080$asset" -o /tmp/salimon-bundle.js
          test -s /tmp/salimon-bundle.js
          curl --fail --silent --show-error http://127.0.0.1:8080/unknown/client/route -o /tmp/salimon-fallback.html
          cmp /tmp/salimon-index.html /tmp/salimon-fallback.html
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/assets/missing.js)"
          test "$code" = "404"
      - name: Display service logs if a check fails
        if: failure()
        run: docker compose logs --no-color
      - name: Shut down the service
        if: always()
        run: docker compose down --remove-orphans
