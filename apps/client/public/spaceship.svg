<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="25 25 350 350" fill="none" role="img"
  aria-labelledby="spaceship-title spaceship-description">
  <title id="spaceship-title">Four-thruster square spaceship</title>
  <desc id="spaceship-description">
    A square top-down spaceship with a central cockpit and one thruster on each side
  </desc>

  <defs>
    <linearGradient id="hull" x1="92" y1="86" x2="314" y2="322" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC" />
      <stop offset="0.55" stop-color="#CBD5E1" />
      <stop offset="1" stop-color="#7C8A9D" />
    </linearGradient>
    <radialGradient id="cockpit" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(180 174) rotate(46) scale(93)">
      <stop stop-color="#A5F3FC" />
      <stop offset="0.38" stop-color="#167A92" />
      <stop offset="0.78" stop-color="#12304A" />
      <stop offset="1" stop-color="#071426" />
    </radialGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#475569" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <filter id="cockpit-glow" x="112" y="112" width="176" height="176" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- Four side-mounted thruster housings -->
  <g fill="url(#engine)" stroke="#94A3B8" stroke-width="5" stroke-linejoin="round">
    <path d="M157 72L166 30H234L243 72L225 91H175L157 72Z" />
    <path d="M328 157L370 166V234L328 243L309 225V175L328 157Z" />
    <path d="M243 328L234 370H166L157 328L175 309H225L243 328Z" />
    <path d="M72 243L30 234V166L72 157L91 175V225L72 243Z" />
  </g>

  <!-- Thruster apertures -->
  <g fill="#071426" stroke="#CBD5E1" stroke-width="4">
    <rect x="174" y="27" width="52" height="17" rx="8.5" />
    <rect x="356" y="174" width="17" height="52" rx="8.5" />
    <rect x="174" y="356" width="52" height="17" rx="8.5" />
    <rect x="27" y="174" width="17" height="52" rx="8.5" />
  </g>
  <g fill="#22D3EE">
    <rect x="181" y="32" width="38" height="7" rx="3.5" />
    <rect x="361" y="181" width="7" height="38" rx="3.5" />
    <rect x="181" y="361" width="38" height="7" rx="3.5" />
    <rect x="32" y="181" width="7" height="38" rx="3.5" />
  </g>

  <!-- Square armored hull -->
  <rect x="72" y="72" width="256" height="256" rx="10" fill="url(#hull)" stroke="#475569" stroke-width="7" />
  <path d="M89 89H151L166 105H234L249 89H311V151L295 166V234L311 249V311H249L234 295H166L151 311H89V249L105 234V166L89 151V89Z"
    fill="none" stroke="#94A3B8" stroke-width="3" />

  <!-- Corner armor panels -->
  <g fill="#AAB5C4" stroke="#64748B" stroke-width="3">
    <path d="M88 88H151L166 103L144 126H88V88Z" />
    <path d="M312 88V151L297 166L274 144V88H312Z" />
    <path d="M312 312H249L234 297L256 274H312V312Z" />
    <path d="M88 312V249L103 234L126 256V312H88Z" />
  </g>

  <!-- Directional marking -->
  <path d="M181 91L200 78L219 91L211 100H189L181 91Z" fill="#AA3BFF" />

  <!-- Central cockpit glow and canopy -->
  <circle cx="200" cy="200" r="70" fill="#22D3EE" opacity="0.2" filter="url(#cockpit-glow)" />
  <circle cx="200" cy="200" r="65" fill="url(#cockpit)" stroke="#111827" stroke-width="7" />
  <circle cx="200" cy="200" r="52" fill="none" stroke="#67E8F9" stroke-width="2" opacity="0.55" />
  <path d="M200 137V263M137 200H263" stroke="#94A3B8" stroke-width="3" opacity="0.75" />
  <path d="M160 162C174 148 190 143 207 145" stroke="#E0F2FE" stroke-width="8" stroke-linecap="round"
    opacity="0.65" />

  <!-- Hull panel details -->
  <g fill="#334155">
    <circle cx="119" cy="119" r="5" />
    <circle cx="281" cy="119" r="5" />
    <circle cx="281" cy="281" r="5" />
    <circle cx="119" cy="281" r="5" />
  </g>
</svg>
