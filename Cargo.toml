[workspace]
members = [
    "client/character",
    "client/diagnostics",
    "client/math",
    "client/physics",
    "client/renderer",
    "client/runtime",
    "client/ship",
    "client/world",
]
default-members = ["client/runtime"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
env_logger = "=0.11.8"
gltf = { version = "=1.4.1", default-features = false, features = ["names", "utils"] }
log = "=0.4.29"
pollster = "=0.4.0"
wgpu = "=30.0.1"
winit = "=0.30.13"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

# Keep authored convex contact loops responsive in debug gameplay and tests.
# Debug assertions and debug information remain enabled.
[profile.dev.package.salimon-physics]
opt-level = 2

[profile.dev.package.salimon-math]
opt-level = 2

[profile.test.package.salimon-physics]
opt-level = 2

[profile.test.package.salimon-math]
opt-level = 2
