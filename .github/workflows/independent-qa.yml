name: Independent game QA

on:
  workflow_run:
    workflows: ['Navigation client']
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Open Salimon PR number to review after current-head CI'
        required: true
        type: string
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
  schedule:
    - cron: '*/15 * * * *'

# Repository write credentials only exist in jobs that execute trusted main.
# No checkout, installation or execution of PR files; artifacts are data only.
permissions:
  contents: read

concurrency:
  group: independent-qa-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr || 'invalidation-scan' }}
  cancel-in-progress: false

jobs:
  review:
    if: github.repository == 'mr-exception/salimon' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/qa
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bounded independent visual review and deterministic veto
        if: hashFiles('.github/qa/review.py') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SALIMON_REVIEW_MODEL: ${{ vars.SALIMON_REVIEW_MODEL }}
        run: python .github/qa/review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-output/report.json
          retention-days: 90

  invalidate:
    if: github.repository == 'mr-exception/salimon' && github.event_name != 'workflow_run' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/qa
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/qa/invalidate.py
        if: hashFiles('.github/qa/invalidate.py') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
