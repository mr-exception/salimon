name: Source build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Source build (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Keep developer rustfmt/Clippy components out of this build-and-portable-test job.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Documentation validator contracts
        run: python -m unittest discover -s scripts -p test_check_docs.py -v
      - name: Offline documentation validation
        env:
          DOCS_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$DOCS_BASE" ]; then
            python scripts/check_docs.py --base "$DOCS_BASE"
          else
            python scripts/check_docs.py
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libxkbcommon-dev libwayland-dev
      - name: Compile workspace
        run: cargo build --workspace --locked
      - name: Portable workspace unit and session E2E contracts
        run: cargo test --workspace --locked
