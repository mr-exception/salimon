name: Generate silicate assets

on:
  push:
    branches: [issue-90-silicate-fragments]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-90-silicate-fragments
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Blender and model dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          python -m pip install -r models/tools/requirements.txt
      - name: Generate editable sources and runtime exports
        run: |
          blender --background --factory-startup --python-exit-code 1 --python models/assets/resources/silicate-fragment-slab/create_source.py
          blender --background --factory-startup --python-exit-code 1 --python models/assets/resources/silicate-fragment-ridge/create_source.py
          python models/tools/export_asset.py resource.silicate-fragment-slab --blender blender
          python models/tools/export_asset.py resource.silicate-fragment-ridge --blender blender
          python models/tools/validate_asset.py resource.silicate-fragment-slab
          python models/tools/validate_asset.py resource.silicate-fragment-ridge
      - name: Commit generated assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add models/assets/resources/silicate-fragment-*/source.blend client/assets/resources/silicate-fragment-*/model.glb
          if ! git diff --cached --quiet; then
            git commit -m "Generate silicate Blender sources and exports"
            git push origin HEAD:issue-90-silicate-fragments
          fi
