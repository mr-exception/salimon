name: Native builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      visual_evidence:
        description: Run optional Linux screenshot checkpoint scenarios
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fragment-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all
      - run: cargo test -p salimon-physics -p salimon-world --locked
      - run: cargo clippy -p salimon-physics -p salimon-world --all-targets --locked -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-148-formatted-sources
          path: |
            client/**/src/*.rs
            client/**/tests/*.rs

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Debian build and runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libvulkan1 mesa-vulkan-drivers xvfb xauth xdotool imagemagick
          icd_files=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test -f "${icd_files[0]}"
          echo "VK_DRIVER_FILES=${icd_files[0]}" >> "$GITHUB_ENV"
      - name: Generic model validation contract tests
        run: |
          python -m pip install -r models/tools/requirements.txt
          python -m unittest discover -s models/tests -v
      - name: Build script and E2E runner contract tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Rust quality gates
        shell: bash
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Stage debug executable
        if: always()
        run: python scripts/build_game.py --profile debug --output artifacts/build/debug
      - name: Stage release executable
        if: always()
        run: python scripts/build_game.py --profile release --output artifacts/build/release
      - name: Issue 148 before and after pile evidence
        if: always() && runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
        run: |
          mkdir -p artifacts/issue-148
          git fetch origin 8cc50660f8b4946c23448fb317745adbc90db28d --depth=1
          git worktree add /tmp/salimon-before 8cc50660f8b4946c23448fb317745adbc90db28d
          cp client/runtime/src/e2e.rs /tmp/salimon-before/client/runtime/src/e2e.rs
          cp scenarios/evidence/fragment-pile-*.json /tmp/salimon-before/scenarios/evidence/
          (cd /tmp/salimon-before && cargo build --locked --release -p salimon-client --target-dir "$GITHUB_WORKSPACE/target")
          cp target/release/salimon-client artifacts/issue-148/salimon-client-before
          for surface in floor surface; do
            xvfb-run -a -s '-screen 0 1280x800x24' python scripts/salimon-test run scenarios/evidence/fragment-pile-$surface.json --binary artifacts/issue-148/salimon-client-before --artifacts artifacts/issue-148/before-$surface --screenshot-command '["python", "scripts/capture_settled.py", "{path}"]'
            xvfb-run -a -s '-screen 0 1280x800x24' python scripts/salimon-test run scenarios/evidence/fragment-pile-$surface.json --binary artifacts/build/release/salimon-client --artifacts artifacts/issue-148/after-$surface --screenshot-command '["python", "scripts/capture_settled.py", "{path}"]'
          done
      - name: Linux deterministic E2E baseline (Mesa software Vulkan)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        env:
          WGPU_BACKEND: vulkan
        run: |
          set -euo pipefail
          mkdir -p artifacts/e2e
          test -f "$VK_DRIVER_FILES"
          command -v import
          xvfb-run -a -s '-screen 0 1280x800x24' bash -euo pipefail -c '
            import -window root artifacts/e2e/display-ready.png
            python scripts/salimon-test suite --binary artifacts/build/release/salimon-client
            python scripts/salimon-test run scenarios/evidence/lower-cockpit-windows.json --binary artifacts/build/release/salimon-client --screenshot-command "[\"python\", \"scripts/capture_settled.py\", \"{path}\"]"
            python scripts/salimon-test suite --group resource-collection --evidence --binary artifacts/build/release/salimon-client --screenshot-command "[\"python\", \"scripts/capture_settled.py\", \"{path}\"]"
            python scripts/salimon-test suite --group ship-eva --evidence --binary artifacts/build/release/salimon-client --screenshot-command "[\"python\", \"scripts/capture_settled.py\", \"{path}\"]"
          ' 2>&1 | tee artifacts/e2e/baseline.log
      - name: Linux optional visual checkpoints (Mesa software Vulkan)
        if: runner.os == 'Linux' && inputs.visual_evidence == true
        timeout-minutes: 10
        shell: bash
        env:
          WGPU_BACKEND: vulkan
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x800x24' bash -euo pipefail -c '
            for scenario in scenarios/evidence/*.json; do
              python scripts/salimon-test run "$scenario" --binary artifacts/build/release/salimon-client
            done
          ' 2>&1 | tee artifacts/e2e/visual.log
      - name: Record native graphics coverage on macOS and Windows
        if: runner.os != 'Linux'
        shell: bash
        run: echo 'Native graphical E2E is not run on this platform in CI; run the baseline/evidence suites on a local GPU desktop. Build, Rust, and Python checks still run.' >> "$GITHUB_STEP_SUMMARY"
      - name: Linux packaged black-box smoke (real X11 input)
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python scripts/packaged_smoke.py --binary artifacts/build/release/salimon-client --timeout 90
      - name: Preserve runnable builds and smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salimon-${{ matrix.os }}
          path: |
            client/**/src/*.rs
            client/**/tests/*.rs
            artifacts/build/
            artifacts/issue-148/
            artifacts/e2e/
            artifacts/packaged-smoke/
          if-no-files-found: warn
